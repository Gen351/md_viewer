<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer Editor</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script>
    // MathJax v3 configuration. Must run before the library loads.
    // startup.typeset:false keeps MathJax from scanning the whole page on
    // load — app.js explicitly typesets only the extracted math nodes via
    // MathJax.typesetPromise(), so markdown rendering stays synchronous.
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: false,
        processEnvironments: true,
        tags: 'none'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script id="mathjaxScript" defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  <link id="hljsTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script id="hljsScript" defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">MD Editor</h1>
      <span class="filename-display" id="filenameDisplay"></span>
    </div>
    <div class="header-center">
      <div class="btn-group toolbar-group" role="group" aria-label="Formatting tools">
        <button class="btn btn-toolbar" id="btnBold" aria-label="Bold" title="Bold (Ctrl+B)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h5a3 3 0 012.08 5.17A3.5 3.5 0 019.5 14H4V2zm2 5h3a1 1 0 100-2H6v2zm0 4h3.5a1.5 1.5 0 100-3H6v3z"/></svg>
        </button>
        <button class="btn btn-toolbar" id="btnH1" aria-label="Heading 1" title="Heading 1">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2v5h3v2H2v5H0V2h2zm10 0v12h-2V2h2z"/></svg>
        </button>
        <button class="btn btn-toolbar" id="btnItalic" aria-label="Italic" title="Italic (Ctrl+I)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6 2h6v2h-2.2l-2.8 8H9v2H3v-2h2.2l2.8-8H6V2z"/></svg>
        </button>
        <button class="btn btn-toolbar" id="btnList" aria-label="Bullet List" title="Bullet List">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="4" r="1.5"/><circle cx="3" cy="8" r="1.5"/><circle cx="3" cy="12" r="1.5"/><rect x="6" y="3.5" width="8" height="1" rx="0.5"/><rect x="6" y="7.5" width="8" height="1" rx="0.5"/><rect x="6" y="11.5" width="8" height="1" rx="0.5"/></svg>
        </button>
        <button class="btn btn-toolbar" id="btnLink" aria-label="Insert Link" title="Insert Link (Ctrl+K)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6.88 10.18L5.47 11.6a2 2 0 01-2.83-2.83l2.83-2.83a2 2 0 012.83 0l1.41 1.42-1.41 1.41-1.41-1.41a1 1 0 00-1.42 0l-2.83 2.83a1 1 0 001.42 1.41l1.41-1.41 1.42 1.41zm2.24-4.24l1.41-1.42a2 2 0 012.83 2.83l-2.83 2.83a2 2 0 01-2.83 0l-1.41-1.42 1.41-1.41 1.41 1.41a1 1 0 001.42 0l2.83-2.83a1 1 0 00-1.42-1.41l-1.41 1.41-1.41-1.41z"/></svg>
        </button>
        <button class="btn btn-toolbar" id="btnCode" aria-label="Inline Code" title="Inline Code">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M5.7 12.3l-4-4a1 1 0 010-1.4l4-4 1.4 1.4L3.8 7.6l3.3 3.3-1.4 1.4zm4.6 0l4-4a1 1 0 000-1.4l-4-4-1.4 1.4 3.3 3.3-3.3 3.3 1.4 1.4z"/></svg>
        </button>
      </div>
      <div class="btn-group view-group" role="group" aria-label="View modes">
        <button class="btn btn-view" id="btnFocus" aria-label="Focus view" title="Focus (Editor only)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="14" height="14" rx="2"/></svg>
        </button>
        <button class="btn btn-view active" id="btnSplit" aria-label="Split view" title="Split view">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="14" rx="1"/><rect x="9" y="1" width="6" height="14" rx="1"/></svg>
        </button>
        <button class="btn btn-view" id="btnViewOnly" aria-label="View-only mode" title="View-only (Preview only)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="14" height="10" rx="2"/><circle cx="8" cy="8" r="2"/></svg>
        </button>
      </div>
    </div>
    <div class="header-right">
      <div class="menu-wrapper">
        <button class="btn btn-file" id="menuBtn" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="settingsMenu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
        <div class="menu hidden" id="settingsMenu" role="menu" aria-label="Settings">
          <button class="menu-item" id="btnOpen" role="menuitem" aria-label="Open file" title="Open .md file (Ctrl+O)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3h5l2 2h7v8H1V3zm0 0v10"/></svg>
            Open
          </button>
          <button class="menu-item" id="btnSave" role="menuitem" aria-label="Save file" title="Save .md file (Ctrl+S)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12 15H4a1 1 0 01-1-1V2a1 1 0 011-1h7l4 4v9a1 1 0 01-1 1zM5 1h5v4h4M4 12h8v2H4z"/></svg>
            Save
          </button>
          <button class="menu-item" id="btnShare" role="menuitem" aria-label="Share file" title="Copy a shareable link">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="3" r="2" fill="currentColor" stroke="none"/><circle cx="4" cy="8" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="2" fill="currentColor" stroke="none"/><path d="M5.8 7.1l4.4-2.6M5.8 8.9l4.4 2.6"/></svg>
            Share
          </button>
          <div class="menu-separator" role="separator"></div>
          <div class="menu-flyout-wrapper">
            <button class="menu-item menu-parent" id="mathMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="mathFlyout">
              Math <span class="flyout-arrow" aria-hidden="true">◂</span>
            </button>
            <div class="flyout hidden" id="mathFlyout" role="menu" aria-label="Math mode">
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="true" data-value="off">Off</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="inline">$ inline</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="display">$$ display</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="dollars">$ + $$</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="latex">\( \) / \[ \]</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="all">All</button>
            </div>
          </div>
          <div class="menu-flyout-wrapper">
            <button class="menu-item menu-parent" id="codeMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="codeFlyout">
              Code Themes <span class="flyout-arrow" aria-hidden="true">◂</span>
            </button>
            <div class="flyout hidden" id="codeFlyout" role="menu" aria-label="Code theme">
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="true" data-value="auto">Auto (app theme)</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="github">GitHub Light</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="github-dark">GitHub Dark</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="monokai">Monokai</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="dracula">Dracula</button>
              <button class="menu-item flyout-option" role="menuitemradio" aria-checked="false" data-value="nord">Nord</button>
            </div>
          </div>
          <div class="menu-separator" role="separator"></div>
          <button class="btn btn-theme menu-theme" id="btnTheme" aria-label="Toggle theme" title="Toggle dark/light mode (Ctrl+D)">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>

  <main class="app-main" id="appMain">
    <div class="pane editor-pane" id="editorPane">
      <textarea class="editor" id="editor" placeholder="Start typing your markdown here..." spellcheck="false"></textarea>
    </div>
    <div class="pane preview-pane" id="previewPane">
      <div class="preview" id="preview"></div>
    </div>
  </main>

  <div class="modal-overlay hidden" id="shareModal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
      <h2 class="modal-title" id="shareModalTitle"></h2>
      <p class="modal-message" id="shareModalMessage"></p>
      <button class="btn btn-file modal-close" id="shareModalClose">Close</button>
    </div>
  </div>

  <script src="src/js/app.js"></script>
</body>
</html>
